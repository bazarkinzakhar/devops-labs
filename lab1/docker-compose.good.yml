services:
  db:
    # исправление 1: использование конкретного образа
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD} # исправление 2: храним секреты env
    volumes:
      - db_data:/var/lib/postgresql/data # использование 3: использование volume для хранения данных
    networks:
      - backend

  web:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    networks:
      - frontend

volumes:
  db_data:

networks:
  frontend:
  backend:
