server {
    listen 80;
    server_name app2.local;
    return 301 https://$host$request_uri; # принудительное перенаправление
}

server {
    listen 443 ssl;
    server_name app2.local;
    ssl_certificate /etc/nginx/ssl/nginx.crt; # использование сертификата
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    location / {
        proxy_pass http://app2:5000;
    }

    location /data/ {
        alias /usr/share/nginx/html/;
    }
}
